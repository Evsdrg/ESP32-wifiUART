; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_120_16_8-qio_opi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino
lib_deps =
  ArduinoJson
  FastLED
monitor_speed = 115200
build_flags =
  -D UART1_RX_PIN=13
  -D UART1_TX_PIN=14
  -D TCP_BRIDGE_PORT=6638
; Optional: connect to your existing WiFi instead of opening an AP.
; 可选：连接到现有 WiFi，而不是开启 AP。
; Escape quotes exactly like below if you enable them.
; 如果启用，请严格按如下方式转义引号。
;  -D WIFI_SSID='"your-ssid"'
;  -D WIFI_PASSWORD='"your-password"'
; Optional: customize AP fallback credentials.
; 可选：自定义 AP 回退凭据。
;  -D AP_SSID='"ESP32S3-UART"'
;  -D AP_PASSWORD='"12345678"'
