; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; ESP32-S3
; ============================================================
; Board: ESP32-S3 16MB QIO flash, 8MB OPI PSRAM
; UART: RX=IO13, TX=IO14
; Status LED: WS2812 RGB LED on IO48 (RGB_BUILTIN)
; UART FIFO tier: HIGH, threshold=96 bytes
;   115200: ~120 interrupts/s, ~8.3 ms packetization delay
;   460800: ~480 interrupts/s, ~2.1 ms packetization delay
;   921600: ~960 interrupts/s, ~1.0 ms packetization delay
[env:esp32s3_120_16_8-qio_opi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino
lib_deps =
	ArduinoJson
monitor_speed = 115200
platform_packages = espressif/framework-arduinoespressif32
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D UART1_RX_PIN=13
	-D UART1_TX_PIN=14
	-D STATUS_LED_PIN=48
	-D USE_RGB_STATUS_LED=1
	-D STATUS_RGB_BRIGHTNESS=10
	-D UART_FIFO_THRESHOLD=96
	-D TCP_BRIDGE_PORT=6638
	-D DEVICE_LABEL='"ESP32-S3"'
	-D AP_SSID='"ESP32S3-UART"'
	; Optional: allocate bridge buffers from PSRAM instead of static SRAM.
	; 可选：从 PSRAM 分配桥接缓冲区，而不是使用静态 SRAM。
	; -D USE_PSRAM_BRIDGE_BUFFERS=1
	; Optional: explicitly configure Wi-Fi TX power. Disabled by default on S3.
	; 可选：显式配置 Wi-Fi 发射功率。S3 默认不配置。
	; -D CONFIGURE_WIFI_TX_POWER=1
	; -D WIFI_TX_POWER=WIFI_POWER_8_5dBm
	; Optional: connect to your existing WiFi instead of opening an AP.
	; 可选：连接到现有 WiFi，而不是开启 AP。
	; -D WIFI_SSID='"your-ssid"'
	; -D WIFI_PASSWORD='"your-password"'
	; Optional: customize AP fallback credentials.
	; 可选：自定义 AP 回退凭据。
	; -D AP_PASSWORD='"12345678"'
	; Optional: protect the web UI and HTTP API with Basic Auth.
	; 可选：用 Basic Auth 保护网页与 HTTP API。
	; -D ENABLE_HTTP_AUTH=1
	; -D HTTP_AUTH_USERNAME='"admin"'
	; -D HTTP_AUTH_PASSWORD='"change-me"'

; ============================================================
; ESP32-C3 SuperMini
; ============================================================
; Board: common ESP32-C3 SuperMini boards
; UART: RX=IO3, TX=IO4
; Status LED: onboard single-color LED on IO8, active-low
; UART FIFO tier: MID, threshold=32 bytes
;   115200: ~360 interrupts/s, ~2.8 ms packetization delay
;   460800: ~1440 interrupts/s, ~0.69 ms packetization delay
; Default app partition is enough; no huge_app.csv override is used.
[env:nologo_esp32c3_super_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
board_build.f_cpu = 80000000L
framework = arduino
lib_deps =
	ArduinoJson
monitor_speed = 115200
platform_packages = espressif/framework-arduinoespressif32@^3.3.8
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D UART1_RX_PIN=3
	-D UART1_TX_PIN=4
	-D USE_RGB_STATUS_LED=0
	-D STATUS_LED_PIN=8
	-D STATUS_LED_ACTIVE_LEVEL=0
	-D UART_FIFO_THRESHOLD=32
	-D TCP_BRIDGE_PORT=6638
	-D DEVICE_LABEL='"ESP32-C3"'
	-D AP_SSID='"ESP32C3-UART"'
	-D CONFIGURE_WIFI_TX_POWER=1
	-D WIFI_TX_POWER=WIFI_POWER_8_5dBm
	; Optional: explicitly configure Wi-Fi TX power. C3 default is limited in app_config.h.
	; 可选：显式配置 Wi-Fi 发射功率。C3 默认在 app_config.h 中限制。
	; Optional: connect to your existing WiFi instead of opening an AP.
	; 可选：连接到现有 WiFi，而不是开启 AP。
	; -D WIFI_SSID='"your-ssid"'
	; -D WIFI_PASSWORD='"your-password"'
	; Optional: protect the web UI and HTTP API with Basic Auth.
	; 可选：用 Basic Auth 保护网页与 HTTP API。
	; -D ENABLE_HTTP_AUTH=1
	; -D HTTP_AUTH_USERNAME='"admin"'
	; -D HTTP_AUTH_PASSWORD='"change-me"'

; ============================================================
