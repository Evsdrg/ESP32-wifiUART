; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; 公共基础配置（所有环境共享）
; ============================================================
[env]
framework = arduino
lib_deps =
	ArduinoJson
monitor_speed = 115200
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D TCP_BRIDGE_PORT=6638
	; -D WIFI_SSID='"your-ssid"'
	; -D WIFI_PASSWORD='"your-password"'
	; -D AP_SSID='"YourAP"'
	; -D AP_PASSWORD='"12345678"'
platform_packages = espressif/framework-arduinoespressif32

; ============================================================
; ESP32-S3 环境
; - HIGH 档 UART FIFO 阈值（96字节）
;   115200下120Hz中断/8.3ms延迟，460800下480Hz/2.1ms，921600下960Hz/1ms
; ============================================================
[env:esp32s3_120_16_8-qio_opi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
build_flags =
	${env.build_flags}
	-D UART1_RX_PIN=13
	-D UART1_TX_PIN=14
	-D USE_RGB_STATUS_LED=1
	-D UART_FIFO_THRESHOLD=96
	; Optional: allocate bridge buffers from PSRAM instead of static SRAM.
	; 可选：从 PSRAM 分配桥接缓冲区，而不是使用静态 SRAM。
	; -D USE_PSRAM_BRIDGE_BUFFERS=1
	; -D CONFIGURE_WIFI_TX_POWER=1
	; -D WIFI_TX_POWER=WIFI_POWER_8_5dBm

; ============================================================
; ESP32-C3 环境
; - MID 档 UART FIFO 阈值（32字节）
;   115200下360Hz中断/2.8ms延迟，460800下1440Hz/0.69ms，兼顾中断与响应
; ============================================================
[env:nologo_esp32c3_super_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
board_build.f_cpu = 80000000L
build_flags =
	${env.build_flags}
	-D UART1_RX_PIN=3
	-D UART1_TX_PIN=4
	-D USE_RGB_STATUS_LED=0
	-D STATUS_LED_PIN=7
	-D UART_FIFO_THRESHOLD=32
	; -D CONFIGURE_WIFI_TX_POWER=1
	; -D WIFI_TX_POWER=WIFI_POWER_8_5dBm

; ============================================================
; ESP32-C6 环境（默认）
; - HIGH 档 UART FIFO 阈值（96字节）
; ============================================================
[env:esp32_c6_devkitc_1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags =
	${env.build_flags}
	-D UART1_RX_PIN=10
	-D UART1_TX_PIN=11
	-D USE_RGB_STATUS_LED=1
	-D UART_FIFO_THRESHOLD=96
	; -D CONFIGURE_WIFI_TX_POWER=1
	; -D WIFI_TX_POWER=WIFI_POWER_8_5dBm
