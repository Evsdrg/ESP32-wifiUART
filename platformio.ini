; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32_c6_devkitc_1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.partitions = huge_app.csv
framework = arduino
lib_deps = 
	ArduinoJson
monitor_speed = 115200
build_flags = 
	-D CORE_DEBUG_LEVEL=0
	-D UART1_RX_PIN=18
	-D UART1_TX_PIN=9
	-D USE_RGB_STATUS_LED=1
	-D TCP_BRIDGE_PORT=6638
; Optional: explicitly configure Wi-Fi TX power. Disabled by default on C6.
; 可选：显式配置 Wi-Fi 发射功率。C6 默认不配置。
; 	-D CONFIGURE_WIFI_TX_POWER=1
; 	-D WIFI_TX_POWER=WIFI_POWER_8_5dBm
; Optional: connect to your existing WiFi instead of opening an AP.
; 可选：连接到现有 WiFi，而不是开启 AP。
; Escape quotes exactly like below if you enable them.
; 如果启用，请严格按如下方式转义引号。
; 	-D WIFI_SSID='"your-ssid"'
; 	-D WIFI_PASSWORD='"your-password"'
; Optional: customize AP fallback credentials.
; 可选：自定义 AP 回退凭据。
; 	-D AP_SSID='"ESP32C6-UART"'
; 	-D AP_PASSWORD='"12345678"'
platform_packages = espressif/framework-arduinoespressif32@^3.3.8
