; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nologo_esp32c3_super_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
board_build.f_cpu = 80000000L
board_build.partitions = huge_app.csv
framework = arduino
lib_deps = 
	ArduinoJson
monitor_speed = 115200
build_flags = 
	-D CORE_DEBUG_LEVEL=0
	-D UART1_RX_PIN=3
	-D UART1_TX_PIN=4
	-D STATUS_LED_PIN=8
	-D STATUS_LED_ACTIVE_LEVEL=0
	-D TCP_BRIDGE_PORT=6638
; Optional: connect to your existing WiFi instead of opening an AP.
; 可选：连接到现有 WiFi，而不是开启 AP。
; Escape quotes exactly like below if you enable them.
; 如果启用，请严格按如下方式转义引号。
; 	-D WIFI_SSID='"your-ssid"'
; 	-D WIFI_PASSWORD='"your-password"'
platform_packages = espressif/framework-arduinoespressif32@^3.3.8
